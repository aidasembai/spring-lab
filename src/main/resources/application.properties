spring.messages.basename=messages
spring.messages.encoding=UTF-8
```[cite: 1]

* `spring.messages.basename=messages` — явно указывает Spring Boot, что файлы переводов начинаются со слова `messages` (то есть `messages.properties` и `messages_ru.properties`).
* `spring.messages.encoding=UTF-8` — гарантирует, что русский текст (кириллица) будет читаться корректно и не превратится в «кракозябры».

### Шаг 3. Сохранение и перезапуск

1. Сохраните файл (`Ctrl + S`).
2. Полностью перезапустите приложение в IntelliJ IDEA (**Stop** -> **Run**).
3. Откройте в браузере:
`http://localhost:8080/books/new?lang=ru`

После этого русский язык должен успешно заработать! Попробуйте проверить.